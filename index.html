<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#16221e">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="extra.css?v=42">
<link rel="preload" as="image" href="splash.jpg">
<link rel="preload" as="image" href="icons/icon-512.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title data-k="appTitle">قانون تنسيق النقل والمرور</title>
<style>
:root{--bg:#16221e;--surface:#1e2f29;--ink:#eee8d8;--muted:#a9b6af;--line:#36493f;--brand:#c5a059;--brand-ink:#16221e;--accent:#c5a059;--hl:#6b5a14;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html.light{--bg:#f4f0e6;--surface:#ffffff;--ink:#1a221e;--muted:#5a6b63;--line:#d8d2c4;--brand:#c5a059;--brand-ink:#16221e;--accent:#8a6d2b;--hl:#f0e0a8;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;font-size:1rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:8px;padding:10px 14px}
header h1{font-size:1.1rem;margin:0;flex:1;font-weight:700}
button{font:inherit;cursor:pointer}
.ib{background:transparent;border:0;color:inherit;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.ib:hover,.ib:focus-visible{background:rgba(255,255,255,.18);outline:2px solid rgba(255,255,255,.6)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
#sbar{display:none;padding:8px 14px;background:var(--brand);position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:8}
#sbar.on{display:block}
#q{width:100%;padding:11px 14px;border-radius:10px;border:0;font:inherit;background:var(--surface);color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:14px}
.lead{color:var(--muted);margin:6px 0 14px}
h2.t{font-size:1.15rem;margin:0 0 8px;border-inline-start:5px solid var(--accent);padding-inline-start:10px}
.index{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.index td{border-bottom:1px solid var(--line);padding:0}
.index tr:last-child td{border-bottom:0}
.index a{display:flex;gap:12px;align-items:center;padding:12px 14px;color:inherit;text-decoration:none}
.index a:hover,.index a:focus-visible{background:var(--bg)}
.n{min-width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.cnt{margin-inline-start:auto;color:var(--muted);font-size:.85rem}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 18px;padding:12px}
.sec h3{margin:0 0 10px;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.sec h3 .n{flex:none}
.wrap{overflow-x:auto}
table.d{width:100%;min-width:640px;border-collapse:collapse}
table.d th{background:var(--brand);color:var(--brand-ink);padding:9px 10px;text-align:start;font-size:.92rem;white-space:nowrap}
table.d td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;min-width:120px;white-space:pre-wrap}
table.d th:first-child,table.d td:first-child{width:34%}
.empty{color:var(--muted);text-align:center;padding:14px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--brand);color:var(--brand);background:transparent;border-radius:8px;padding:6px 12px}
.edit [contenteditable]{outline:1px dashed var(--accent);background:rgba(201,138,18,.08)}
.edit [contenteditable][data-placeholder]:empty:before{content:attr(data-placeholder);color:var(--muted);opacity:.7}
.ed{display:none}.edit .ed{display:inline-block}
#res .hit{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
#res .hit b{color:var(--brand)}
#eb{display:none}
footer{max-width:980px;margin:10px auto 24px;padding:0 14px;text-align:center}
footer a{color:var(--muted);font-size:.8rem;text-decoration:underline;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;width:min(92vw,340px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 10px}
dialog input{width:100%;margin:6px 0;padding:10px;border-radius:8px;border:1px solid var(--line);font:inherit;background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
dialog .row{display:flex;gap:8px;margin-top:10px}
dialog .row button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink)}
dialog .row button.s{background:transparent;color:var(--brand)}
#err{color:#c0392b;font-size:.85rem;min-height:1.2em}
#toast{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);margin:auto;width:max-content;max-width:90vw;background:#16261f;color:#fff;padding:8px 16px;border-radius:20px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#toast.on{opacity:1}
header{background:var(--bg);color:var(--accent);border-bottom:1px solid var(--line)}
body::before,#sbar{background:var(--bg)}
.n{background:transparent;border:2px solid var(--accent);color:var(--accent)}
main{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(env(safe-area-inset-bottom,0px) + 78px)}
nav{position:fixed;inset:auto 0 0;z-index:9;display:flex;background:#101a16;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
html.light nav{background:#e8e2d4}
nav a{flex:1;text-align:center;color:var(--muted);text-decoration:none;padding:7px 2px;font-size:.76rem;display:grid}
nav a b{font-size:1.45rem;line-height:1.1;font-weight:400}
nav a.on{color:var(--accent)}
.cards{display:grid;gap:12px}
.card{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--accent);border-radius:16px;background:var(--surface);color:var(--ink);text-decoration:none;box-shadow:0 0 12px rgba(197,160,89,.22)}
.card .ic{font-size:1.8rem}.card .tt{flex:1;font-weight:700}.card .cnt{color:var(--muted);font-size:.8rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{flex-direction:column;position:relative;padding:18px 8px;text-align:center}
.grid2 .card:last-child{grid-column:1/-1}
.ic.big{font-size:3rem}
.cnt2{position:absolute;top:8px;inset-inline-end:8px;background:var(--accent);color:var(--bg);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.sn{position:absolute;top:8px;inset-inline-start:8px;background:var(--bg);color:var(--accent);border:2px solid var(--accent);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.st{background:none;border:0;color:var(--accent);font-size:1.35rem;padding:0 4px}
.mu{color:var(--muted)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row2:last-child{border:0}
.av{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-size:1.8rem;font-weight:700;margin:0 auto 10px}
label{display:block;margin:8px 0;color:var(--muted)}
label input,label textarea{width:100%;margin-top:4px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
label textarea{min-height:90px;resize:vertical}
.dl{padding-inline-start:22px;margin:0}.dl li{padding:6px 0;display:flex;gap:8px;justify-content:space-between}
.hit{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.hit b{color:var(--accent)}.hit .st{position:absolute;inset-inline-end:6px;top:2px}
table.d th.sc,table.d td.sc{min-width:0;width:46px;text-align:center}
.btn{text-decoration:none;display:inline-block}
.i{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
.i.fill{fill:currentColor}.i.big{width:3.6rem;height:3.6rem;color:var(--accent)}
nav a .i{margin:auto}
.card:active,.banner:active{transform:scale(.97)}.card{transition:transform .12s,background .12s}.card:active{background:#26382f}
html.light .card:active{background:#efe9d8}
.banner{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:16px;border-radius:16px;background:linear-gradient(135deg,#c5a059,#e3c98d);color:#16221e;text-decoration:none;box-shadow:0 0 14px rgba(197,160,89,.35)}
.banner .i{width:2.6rem;height:2.6rem}.banner>span:nth-child(2){flex:1;display:grid}.banner small{opacity:.8}
.banner .cnt2{position:static;background:#16221e;color:var(--accent)}
.seg{display:flex;gap:6px;margin:0 0 10px}.seg button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent)}.seg button.on{background:var(--accent);color:var(--bg)}
.hint{color:var(--accent);font-size:.85rem;margin:4px 0 6px;animation:softPulse 2.8s ease-in-out infinite}
@keyframes softPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.03);opacity:.92}}
@keyframes softPulseIcon{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes cardPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 12px rgba(197,160,89,.22)}
  50%{transform:scale(1.025);box-shadow:0 0 20px rgba(197,160,89,.42)}
}
@keyframes cardIconPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
/* نبض مستمر وواضح لبطاقات الصفحة الرئيسية */
.grid2 .card{animation:cardPulse 2.4s ease-in-out infinite}
.grid2 .card .i.big{animation:cardIconPulse 2.4s ease-in-out infinite}
.grid2 .card:nth-child(1){animation-delay:0s}.grid2 .card:nth-child(1) .i.big{animation-delay:0s}
.grid2 .card:nth-child(2){animation-delay:.12s}.grid2 .card:nth-child(2) .i.big{animation-delay:.12s}
.grid2 .card:nth-child(3){animation-delay:.24s}.grid2 .card:nth-child(3) .i.big{animation-delay:.24s}
.grid2 .card:nth-child(4){animation-delay:.36s}.grid2 .card:nth-child(4) .i.big{animation-delay:.36s}
.grid2 .card:nth-child(5){animation-delay:.48s}.grid2 .card:nth-child(5) .i.big{animation-delay:.48s}
.grid2 .card:active{animation:none;transform:scale(.97)}
#nav .i,header .ib svg,header img{animation:softPulseIcon 3.2s ease-in-out infinite}
#nav a:nth-child(2) .i{animation-delay:.15s}
#nav a:nth-child(3) .i{animation-delay:.3s}
#nav a:nth-child(4) .i{animation-delay:.45s}
@media (prefers-reduced-motion:reduce){
  .hint,#nav .i,header .ib svg,header img,.back .ba{animation:none!important}
  /* نبض البطاقات يبقى مرئياً حسب الطلب */
}
.wrap{overflow-x:auto;border-radius:8px;background:linear-gradient(to right,var(--surface),var(--surface)) local,linear-gradient(to left,var(--surface),var(--surface)) local,linear-gradient(to right,rgba(0,0,0,.55),transparent) scroll,linear-gradient(to left,rgba(0,0,0,.55),transparent) scroll;background-repeat:no-repeat;background-size:30px 100%,30px 100%,16px 100%,16px 100%;background-position:left,right,left,right}
.wrap::-webkit-scrollbar{height:8px}.wrap::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px}
.vc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}.vc[open]{border-color:var(--accent)}
.vc summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px;cursor:pointer;font-weight:700}
.vc summary::-webkit-details-marker{display:none}.vc .vt{flex:1}
.vc .ch{color:var(--accent);transition:transform .2s}.vc[open] .ch{transform:rotate(180deg)}
.vb{padding:0 12px 12px}.fl{margin-top:8px}.fl span{font-size:.8rem}.fl p{margin:2px 0 0;white-space:pre-wrap}
.dc{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}.dc .i{color:var(--accent)}.dc>span{flex:1}
.stats{display:flex;gap:10px;margin:10px 0}.stats>div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid}.stats b{font-size:1.6rem;color:var(--accent)}
#upd{text-align:center}.up{display:inline-block}img.av{object-fit:cover}
.faq{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}.faq summary{padding:12px;cursor:pointer;font-weight:700;list-style:none}.faq summary::-webkit-details-marker{display:none}.faq p{padding:0 12px 12px;margin:0;color:var(--muted)}
.devrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}.devrow:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-inline-end:6px}.dot.on{background:#2ecc71}.dot.off{background:#95a5a6}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.75rem;background:var(--accent);color:var(--bg)}
.rep{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg)}.rep .mu{font-size:.8rem}
.fav-grid{display:flex;flex-direction:column;gap:12px}
.fav-card{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fav-card-header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fav-card-cat{font-size:.78rem;color:var(--accent);font-weight:700}
.fav-card-title{font-size:.98rem;font-weight:700;color:var(--ink);line-height:1.5}
.fav-card-meta{font-size:.85rem;color:var(--muted)}
.fav-empty{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:.95rem}
.report-box{border:1px solid rgba(197,160,89,.45);border-radius:16px;padding:16px;background:linear-gradient(160deg,rgba(197,160,89,.14),rgba(30,47,41,.92));box-shadow:0 0 18px rgba(197,160,89,.14)}
.report-box b{color:var(--accent);display:block;margin-bottom:10px;font-size:1.05rem}
.report-box.locked{opacity:.9}
.report-hint{font-size:.88rem;color:var(--muted);margin:0 0 10px;line-height:1.5}
.report-box .btn.primary{background:var(--accent);color:#16221e;border:0;font-weight:700}
.report-box .btn:disabled{opacity:.5}
.ver-row{cursor:pointer;border-radius:10px;padding:6px 0}
.ver-row:active{opacity:.8}
select.prof-sel,input[type=number]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}

/* رجوع: سهم بسيط داخل سطر العنوان */
.back{display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--accent);background:none;border:0;padding:4px;margin:0;text-decoration:none;line-height:1;transition:transform .15s ease}
.back svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;display:block}
html[dir="ltr"] .back svg{transform:scaleX(-1)}
.back:active{transform:scale(.86)}
h2.t.hb{display:flex;align-items:center;gap:6px}
/* شاشة الافتتاح */
#splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0b1a14;overflow:hidden;transition:opacity .4s ease,visibility .4s ease}
#splash.go{opacity:0;visibility:hidden;pointer-events:none}
#splash .sp-bg{position:absolute;inset:0;background:center/cover no-repeat url("splash.jpg");transform:scale(1.08);animation:spZoom 1.1s ease-out forwards;filter:brightness(.72)}
#splash .sp-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,26,20,.35),rgba(11,26,20,.75))}
#splash .sp-panel{position:relative;z-index:1;text-align:center;padding:20px;animation:spIn .7s ease-out both}
#splash .sp-logo{width:min(42vw,148px);height:min(42vw,148px);border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.45);border:2px solid rgba(197,160,89,.55);object-fit:cover;animation:spPop .75s cubic-bezier(.2,1.2,.4,1) both}
#splash .sp-title{margin:16px 0 4px;font-size:clamp(1.15rem,4.5vw,1.55rem);font-weight:800;color:#e8d5a3;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.5);animation:spIn .7s .12s ease-out both}
#splash .sp-sub{margin:0;color:rgba(238,232,216,.8);font-size:.92rem;animation:spIn .7s .22s ease-out both}
#splash .sp-bar{position:relative;width:120px;height:3px;margin:18px auto 0;border-radius:3px;background:rgba(197,160,89,.25);overflow:hidden}
#splash .sp-bar>i{position:absolute;left:0;top:0;bottom:0;width:42%;border-radius:3px;background:linear-gradient(90deg,#c5a059,#e3c98d);animation:spBarLoop 1.25s ease-in-out infinite}
@keyframes spZoom{to{transform:scale(1)}}
@keyframes spPop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes spIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spBar{to{width:100%}}
@keyframes spBarLoop{from{transform:translateX(-100%)}to{transform:translateX(240%)}}
@media (prefers-reduced-motion:reduce){
  #splash .sp-bg,#splash .sp-panel,#splash .sp-logo,#splash .sp-title,#splash .sp-sub,#splash .sp-bar>i,.back .ba{animation:none!important}
  #splash .sp-bar>i{width:100%}
  #splash .sp-bg{transform:none;filter:brightness(.75)}
}
/* v24: بطاقات بالصور + عناوين + إضاءة الأدلة + واجهة الدخول */
.hx{font-size:1.65rem;font-weight:800;line-height:1.3;margin:8px 2px 6px;padding-inline-start:14px;border-inline-start-width:6px}
.hs{font-size:1rem;font-weight:400;opacity:.85;margin:0 2px 18px;padding-inline-start:20px}
.grid2 .card{min-height:250px;border:2px solid var(--accent);justify-content:flex-end;overflow:hidden;padding:0;background:radial-gradient(120% 90% at 50% 30%,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface) 72%);animation:cardGlow 2.8s ease-in-out infinite}
.grid2 .card:last-child{min-height:230px}
.grid2 .card::after{display:none}
.grid2 .card .tt{position:relative;z-index:2;flex:none;width:100%;min-height:3.4em;padding:10px 6px;display:flex;align-items:center;justify-content:center;border-top:1px solid rgba(197,160,89,.55);background:linear-gradient(180deg,rgba(14,33,25,.6),rgba(11,26,20,.95));color:#f1ede0;font-size:.95rem;line-height:1.4}
.grid2 .card .sn,.grid2 .card .cnt2{z-index:3;top:10px}
.cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:40px 12px 72px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.45));animation:cimgDrive 6s ease-in-out infinite alternate;will-change:transform}
.grid2 .card:nth-child(2) .cimg{animation-duration:7s}.grid2 .card:nth-child(3) .cimg{animation-duration:6.5s}.grid2 .card:nth-child(4) .cimg{animation-duration:7.5s}.grid2 .card:nth-child(5) .cimg{animation-duration:8s}
@keyframes cardGlow{0%,100%{box-shadow:0 0 12px rgba(197,160,89,.22)}50%{box-shadow:0 0 22px rgba(197,160,89,.45)}}
@keyframes cimgDrive{0%{transform:translateX(-10px) scale(1)}50%{transform:translateY(-5px) scale(1.05)}100%{transform:translateX(10px) scale(1.1)}}
.banner{position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 38%,rgba(255,247,222,.7) 50%,transparent 62%);background-size:250% 100%;animation:sheen 3.6s ease-in-out infinite}
.banner.equipment-guide::after{animation-delay:1.8s}
.animated-element{animation:pulse 3s infinite ease-in-out}
.document-guide{animation-delay:0s}.equipment-guide{animation-delay:1.5s}
.banner:active{animation:none}
@keyframes pulse{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-5px);opacity:.9}}

const devIdNorm=v=>String(v||"").replace(/\D/g,"");

async function clearAppCaches(){
  // Cache Storage
  if("caches" in window){
    const keys=await caches.keys();
    await Promise.all(keys.map(k=>caches.delete(k)));
  }
  // Service Workers
  if("serviceWorker" in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r=>r.unregister()));
  }
  // بيانات التطبيق المحلية (المخالفات + الوثائق)
  localStorage.removeItem(KEY);
  localStorage.removeItem("tc_docs");
  localStorage.removeItem("tc_equip");
  localStorage.removeItem("tc_equip_labels");
  localStorage.removeItem("tc_equip_order");
  // كاش Firestore المحلي (IndexedDB) — أهم سبب لبقاء البيانات القديمة
  try{
    if(indexedDB.databases){
      const dbs=await indexedDB.databases();
      await Promise.all((dbs||[]).filter(d=>/firestore|firebase|tc2026|transport/i.test(d.name||"")).map(d=>new Promise(res=>{
        const r=indexedDB.deleteDatabase(d.name);
        r.onsuccess=r.onerror=r.onblocked=()=>res();
      })));
    }else{
      // متصفحات قديمة: أسماء شائعة
      ["firebase-heartbeat-database","firebase-installations-database","firestore/[DEFAULT]/transport-coordination"].forEach(n=>{
        try{indexedDB.deleteDatabase(n)}catch(e){}
      });
    }
  }catch(e){}
}

if("serviceWorker" in navigator){

  // عند استلام SW جديد مفعّل → أعد التحميل تلقائياً
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(refreshing)return;refreshing=true;
    location.reload();
  });
  addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(reg=>{
      const askUpdate=()=>{
        if(!reg.waiting)return;
        // SW جديد في الانتظار → فعّله فوراً
        reg.waiting.postMessage({type:"FORCE_UPDATE"});
        reg.waiting.postMessage({type:"SKIP_WAITING"});
      };
      if(reg.waiting)askUpdate();
      reg.addEventListener("updatefound",()=>{
        const nw=reg.installing;if(!nw)return;
        nw.addEventListener("statechange",()=>{
          if(nw.state==="installed"&&navigator.serviceWorker.controller){
            // نسخة جديدة جاهزة
            askUpdate();
            try{
              if(typeof toast==="function")toast("يتوفر تحديث — جارٍ التحميل…");
            }catch(e){}
          }
        });
      });
      // فحص دوري + عند العودة للتطبيق
      const check=()=>{try{reg.update()}catch(e){}};
      setInterval(check,60*1000);
      document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check()});
      check();
    }).catch(()=>{});
  });
}

window.cloud={

  saveProfile:async(p)=>{

  getProfile:async()=>{
    const sn=await getDoc(doc(db,"profiles",String(window.DEV_ID)));

    window._profSynced=true;

  profHash:async(p)=>{
    const s=[String(p.name||"").trim().replace(/\s+/g," ").toLowerCase(),String(+p.age),String(p.wil||"").trim()].join("|");
    try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).slice(0,16).map(x=>x.toString(16).padStart(2,"0")).join("")}
    catch(e){let a=0x811c9dc5,b=0x1b873593,c=7,d=13;for(const ch of s){const k=ch.charCodeAt(0);a=Math.imul(a^k,16777619);b=Math.imul(b^k,2246822519);c=Math.imul(c^k,3266489917);d=Math.imul(d^k,668265263)}return [a,b,c,d].map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
  },
  ensureLock:async(d)=>{
    try{const h=await window.cloud.profHash(d);const lr=doc(db,"profileLocks",h);const ls=await getDoc(lr);
      if(!ls.exists())await setDoc(lr,{name:String(d.name).slice(0,60),age:+d.age,wil:String(d.wil),dev:String(d.dev||window.DEV_ID),at:serverTimestamp()})}catch(e){}
  },
  bindProfile:async(p)=>{
    const adm=typeof isAdmin!=="undefined"&&isAdmin;
    const ref=doc(db,"profiles",String(window.DEV_ID));
    const ex=await getDoc(ref);
    if(ex.exists()&&!adm){window.applyCloudProfile(ex.data());return{exists:true}}
    const h=await window.cloud.profHash(p),lr=doc(db,"profileLocks",h);
    const restore=async()=>{const ls=await getDoc(lr);if(!ls.exists())return null;const d=ls.data();
      await setDoc(ref,{name:String(d.name).slice(0,60),age:+d.age,wil:String(d.wil),dev:String(window.DEV_ID),at:serverTimestamp(),lk:h});
      window.applyCloudProfile(d);return{exists:true,restored:true}};
    if(!adm){
      let r=null;try{r=await restore()}catch(e){}
      if(r)return r;
      try{await setDoc(lr,{name:String(p.name).slice(0,60),age:+p.age,wil:String(p.wil),dev:String(window.DEV_ID),at:serverTimestamp()})}
      catch(e){try{r=await restore()}catch(_){}if(r)return r}
    }
    await setDoc(ref,adm?{name:String(p.name).slice(0,60),age:+p.age,wil:String(p.wil),dev:String(window.DEV_ID),at:serverTimestamp()}:{name:String(p.name).slice(0,60),age:+p.age,wil:String(p.wil),dev:String(window.DEV_ID),at:serverTimestamp(),lk:h});
    return{exists:false}
  },
  syncFavorites:async(list)=>{
    const id=localStorage.tc_cid||(localStorage.tc_cid=Math.random().toString(36).slice(2)+Date.now().toString(36));
    await setDoc(doc(db,"prefs",id),{favorites:list,updated:serverTimestamp()},{merge:true});

  login:(e,p)=>{window._freshLogin=true;return signInWithEmailAndPassword(auth,e,p).catch(err=>{window._freshLogin=false;throw err})},
  logout:()=>{try{localStorage.removeItem("tc_asid")}catch(e){}return signOut(auth)},
  reportVersion:async()=>{
    try{
      const ref=doc(db,"sections","meta");
      const snap=await getDoc(ref);
      const cur=(snap.exists()&&snap.data().latestVer)||"";
      // حدّث latestVer إذا كان إصدار هذا الجهاز أحدث أو فارغ
      if(!cur||window.APP_VER.localeCompare(cur,undefined,{numeric:true})>0){
        await setDoc(ref,{latestVer:window.APP_VER,latestVerAt:serverTimestamp()},{merge:true});
      }
    }catch(e){console.error("reportVersion",e)}
  },
  broadcast:async (msg,tg,to)=>{
    const ver=String(window.APP_VER||"");
    to=String(to||"").replace(/\D/g,"");
    if(to){/* بث موجّه: وثيقة منفصلة حتى لا يتأثر باقي المستخدمين */
      await setDoc(doc(db,"sections","metaDev"),{to,bid:Date.now(),msg:msg||"",tg:String(tg||"").trim().slice(0,200),ver,updated:serverTimestamp()});
      return ver}
    const ref=doc(db,"sections","meta");
    // إصدار المشرف الحالي (بعد نشر الكود الجديد) هو المرجع دائماً
    await setDoc(ref,{
      bid:Date.now(),
      msg:msg||"",
      tg:String(tg||"").trim().slice(0,200),
      ver,
      latestVer:ver,
      updated:serverTimestamp()
    },{merge:true});
    return ver;
  },
  sendReport:async({name,msg,at})=>{
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const payload={
      name:String(name||"").slice(0,80),
      msg:String(msg||"").slice(0,2000),
      at:Number(at)||Date.now(),
      done:false,status:"new",dev:String(window.DEV_ID||""),
      ua:String(ua||"").slice(0,80),
      ver:String(window.APP_VER||"")
    };
    // جرب inbox ثم reports (يتطلب قواعد Firestore تسمح بالإنشاء للزوار)
    const paths=["inbox/"+id,"reports/"+id];
    let lastErr=null;
    for(const path of paths){
      try{
        await setDoc(doc(db,...path.split("/")),payload);
        return id;
      }catch(e){lastErr=e}
    }
    const code=(lastErr&&lastErr.code)||"";
    if(code==="permission-denied"){
      throw new Error("permission-denied: أضف قواعد Firestore للمجموعة inbox (انظر الملف firestore.rules)");
    }
    throw new Error((code?code+": ":"")+(lastErr&&lastErr.message||"write failed"));
  },
  markReport:async id=>{
    for(const col of ["inbox","reports"]){
      try{await updateDoc(doc(db,col,id),{done:true,status:"reviewed"});return}catch(e){}
    }
    throw new Error("تعذّر تعليم البلاغ");
  },
  replyReport:async(id,text)=>{
    for(const col of ["inbox","reports"]){
      try{await updateDoc(doc(db,col,id),{reply:String(text||"").slice(0,1000),repliedAt:Date.now(),status:"replied",done:true});return}catch(e){}
    }
    throw new Error("تعذّر إرسال الرد");
  },
  getReports:async ids=>{
    const out=[];
    for(const id of (ids||[]).slice(0,30)){
      for(const col of ["inbox","reports"]){
        try{const sn=await getDoc(doc(db,col,id));if(sn.exists()){const x=sn.data();out.push({id,status:x.status||(x.done?"reviewed":"new"),reply:x.reply||"",repliedAt:x.repliedAt||0});break}}catch(e){}
      }
    }
    return out;
  },
  logOp:a=>{const id=Date.now().toString(36);setDoc(doc(db,"ops",id),{a,t:new Date().toISOString(),ua}).catch(()=>{})},
  banDevice:async id=>{
    id=String(id||"").replace(/\D/g,"");

    await setDoc(doc(db,"banned",id),{at:serverTimestamp(),by:String(window.DEV_ID||""),ua:String(ua||"").slice(0,80)});
  },
  unbanDevice:async id=>{
    id=String(id||"").replace(/\D/g,"");
    if(id.length!==8)throw new Error("invalid device id");
    await deleteDoc(doc(db,"banned",id));
  }
};

setTimeout(()=>{try{window.cloud.getProfile().then(()=>{if(location.hash==="#profile"&&typeof showProfile==="function")showProfile()}).catch(()=>{})}catch(e){}},1500);
/* عدّ المستخدمين: حصراً بمعرّف الجهاز الثابت (Device ID) مع إزالة التكرار.
   presence/{DeviceID} سجل دائم لكل جهاز زار التطبيق؛ متصل = نبضة خلال آخر 150 ثانية، وإلا فهو غير متصل. */
const ONLINE_MS=150000;
async function loadPresence(force){
  const now=Date.now();
  if(force||!window._pfull||now-window._pfull.at>300000){
    const ps=await getDocs(collection(db,"presence"));
    const map={},canon=new Set(),legacy=[];
    ps.forEach(d=>{const x=d.data();
      let dev=String(x.dev||"").replace(/\D/g,"");
      /* إن كان معرّف الوثيقة 8 أرقام نعتبره Device ID حتى لو حقل dev ناقصاً */
      if(!dev&&/^\d{8}$/.test(d.id))dev=d.id;
      const ts=x.t&&x.t.toMillis?x.t.toMillis():0;
      if(!dev){legacy.push({ref:d.ref});return}
      if(d.id===dev)canon.add(dev);else legacy.push({ref:d.ref,dev});
      const o=map[dev];if(!o||ts>o.ts)map[dev]={id:dev,dev,ts,ua:String(x.ua||"").slice(0,90),lang:x.lang||""}});
    window._pfull={at:now,map};
    /* تنظيف السجلات القديمة (بمعرّف عشوائي أو بدون Device ID): نقلها إلى السجل الدائم ثم حذفها */
    if(auth.currentUser&&legacy.length)(async()=>{
      for(const l of legacy.slice(0,300)){try{
        if(l.dev&&!canon.has(l.dev)){const m=map[l.dev];await setDoc(doc(db,"presence",l.dev),{t:Timestamp.fromMillis(m.ts||now),ua:m.ua,lang:m.lang,dev:l.dev},{merge:true});canon.add(l.dev)}
        await deleteDoc(l.ref)}catch(e){console.error("presence cleanup",e)}}})()
  }
  const map=window._pfull.map;
  try{const q=await getDocs(query(collection(db,"presence"),where("t",">",Timestamp.fromMillis(now-ONLINE_MS))));
    q.forEach(d=>{const x=d.data();
      let dev=String(x.dev||"").replace(/\D/g,"");
      if(!dev&&/^\d{8}$/.test(d.id))dev=d.id;
      if(!dev)return;const ts=x.t&&x.t.toMillis?x.t.toMillis():0;
      const o=map[dev];if(!o||ts>=o.ts)map[dev]={id:dev,dev,ts,ua:String(x.ua||"").slice(0,90),lang:x.lang||""}})}catch(e){}
  const ep=await loadCounterEpoch();
  const all=Object.values(map).filter(x=>x.ts>=ep).sort((a,b)=>b.ts-a.ts);
  return{total:all.length,online:all.filter(x=>now-x.ts<ONLINE_MS),offline:all.filter(x=>now-x.ts>=ONLINE_MS)}}
/* زر "فحص": تصفير عدّاد المستخدمين فوراً دون حذف أو تعديل أي معرّف جهاز أو ملف شخصي.
   يُسجَّل وقت التصفير في admin/counterReset؛ يُحتسب في العدّاد فقط الجهاز الذي يظهر (نبضة presence.t) بعد هذا الوقت.
   أي مستخدم يفتح التطبيق أو يكون مفتوحاً عنده تُسجَّل نبضته تلقائياً فيُحتسب من جديد خلال ثوانٍ. */
async function loadCounterEpoch(){
  try{const sn=await getDoc(doc(db,"admin","counterReset"));const t=sn.exists()&&sn.data().at&&sn.data().at.toMillis?sn.data().at.toMillis():0;window._cntEpoch=t;return t}
  catch(e){return window._cntEpoch||0}
}
async function resetCounter(){
  if(!auth.currentUser)throw new Error("auth");
  const r=doc(db,"admin","counterReset");
  await setDoc(r,{at:serverTimestamp(),by:String(window.DEV_ID||"")});
  const t=await loadCounterEpoch();
  const T=document.getElementById("stT"),A=document.getElementById("stA");
  if(T)T.textContent="0";if(A)A.textContent="0";
  if(window._lastStats){window._lastStats.users=0;window._lastStats.active=0;window._lastStats.devices=[];window._lastStats.offline=[]}
  try{window.cloud.logOp&&window.cloud.logOp("counter-reset")}catch(e){}
  return{epoch:t}
}
window.cloud.resetCounter=resetCounter;
let st;
async function stats(){try{
  const now=Date.now();
  const P=await loadPresence();
  const devices=P.online,offline=P.offline,users=P.total,active=P.online.length;
  let admDev="";try{const sn=await getDoc(doc(db,"admin","session"));if(sn.exists())admDev=String(sn.data().dev||"")}catch(e){}
  let banned={};
  try{
    const bs=await getDocs(collection(db,"banned"));
    bs.forEach(d=>{const id=String(d.id||"").replace(/\D/g,"");if(id.length===8)banned[id]=1});
  }catch(e){}
  let ops=[];
  try{
    const os=await getDocs(query(collection(db,"ops"),orderBy("t","desc"),limit(500)));
    os.forEach(d=>{const x=d.data();ops.push({a:x.a,t:x.t})});
  }catch(e){}
  let reports=[];
  for(const col of ["inbox","reports"]){
    try{
      const rs=await getDocs(collection(db,col));
      rs.forEach(d=>{const x=d.data();reports.push({id:d.id,name:x.name||"",msg:x.msg||"",at:x.at||0,done:!!x.done,status:x.status||(x.done?"reviewed":"new"),reply:x.reply||"",repliedAt:x.repliedAt||0,dev:x.dev||"",ver:x.ver||""})});
    }catch(e){console.error(col,e)}
  }
  {const seen={};reports=reports.filter(r=>{if(seen[r.id])return false;seen[r.id]=1;return true});
   reports.sort((a,b)=>(b.at||0)-(a.at||0));reports=reports.slice(0,100)}
  window.showStats({active,users,devices,offline,ops,reports,admDev,banned})
}catch(e){console.error(e)}}
let unsubRep=null,unsubSess=null;
/* جلسة مشرف واحدة: الدخول من جهاز جديد ينهي جلسة الجهاز القديم */
const sessRef=()=>doc(db,"admin","session");
async function claimSession(){const sid=Date.now().toString(36)+Math.random().toString(36).slice(2,8);try{localStorage.setItem("tc_asid",sid)}catch(e){}
  await setDoc(sessRef(),{sid,dev:String(window.DEV_ID||""),ua,at:serverTimestamp()});return sid}
function kickSelf(){try{localStorage.removeItem("tc_asid")}catch(e){}if(unsubSess){try{unsubSess()}catch(e){}unsubSess=null}
  signOut(auth).catch(()=>{});try{window.onAdminKicked?window.onAdminKicked():alert("تم تسجيل الدخول بحساب المشرف من جهاز آخر، لذلك أُنهيت جلستك على هذا الجهاز.")}catch(e){}}
async function startSession(){
  const fresh=!!window._freshLogin;window._freshLogin=false;let mine="";try{mine=localStorage.getItem("tc_asid")||""}catch(e){}
  try{
    if(fresh)await claimSession();
    else{const sn=await getDoc(sessRef());if(!sn.exists()||!sn.data().sid)await claimSession();else if(!mine||sn.data().sid!==mine){kickSelf();return false}}
  }catch(e){console.error("session",e)}
  if(unsubSess){try{unsubSess()}catch(e){}}
  unsubSess=onSnapshot(sessRef(),sn=>{if(!sn.exists()||sn.metadata.hasPendingWrites||sn.metadata.fromCache)return;let m="";try{m=localStorage.getItem("tc_asid")||""}catch(e){}const sid=sn.data().sid;if(sid&&m&&sid!==m)kickSelf()},()=>{});
  return true}
onAuthStateChanged(auth,async u=>{
  window.setAdmin(!!u);clearInterval(st);
  if(unsubRep){try{unsubRep()}catch(e){}unsubRep=null}
  if(!u&&unsubSess){try{unsubSess()}catch(e){}unsubSess=null}
  if(u){
    if(!(await startSession()))return;
    stats();st=setInterval(stats,20000);
    // استماع مباشر للبلاغات
    try{
      try{onSnapshot(collection(db,"inbox"),()=>{stats()},()=>{})}catch(e){}
      unsubRep=onSnapshot(collection(db,"reports"),()=>{stats()},e=>console.error("rep listen",e));
    }catch(e){}
  }
});
</script>
